<aside  class="sidebar-container" #sidebarDiv >
    <div class="sidebar-header" #sidebarHeaderDiv>
        <p-accordion 
            [value]="0"
            [collapseIcon]="'pi pi-angle-down'"
            [expandIcon]="'pi pi-angle-down'"
            (valueChange)="updateSideBarBodyheight($event)">

            <p-accordion-panel [value]="1">
                <p-accordion-header>
                    <div class="grid grid-nogutter">
                        <div class="col-12">
                            <p>Header 1 {{sidebarHeaderDiv.offsetHeight}}</p>
                        </div>
                    </div>
                </p-accordion-header>

                <p-accordion-content>
                    <p-menu [model]="items" styleClass="sidebar-header-menu" />
                </p-accordion-content>
            </p-accordion-panel>
        </p-accordion>
    </div>

    <div class="sidebar-body" #sidebarBodyDiv [ngStyle]="{'height': calculateSideBarBodyHeight}">
        <p-panelmenu [model]="sideBarItems" styleClass="w-full md:w-80">
            <ng-template #item let-item>
                <ng-container *ngIf="item.route; else urlRef">
                    <a  class="flex align-items-center
                        cursor-pointer text-color px-3 py-2">
                        <span [class]="item.icon"></span>
                        <span class="ml-2">{{ item.label }}</span>
                    </a>
                </ng-container>
                <ng-template #urlRef>
                    <a *ngIf="item.url; else noLink" [href]="item.url" class="flex align-items-center
                        cursor-pointer text-color px-3 py-2">
                        <span [class]="item.icon"></span>
                        <span class="ml-2">{{ item.label }}</span>
                    </a>
                    <ng-template #noLink>
                        <span class="flex items-center cursor-pointer text-surface-700 dark:text-surface-0 px-4 py-2">
                            <span [class]="item.icon"></span>
                            <span class="ml-2">{{ item.label }}</span>
                            <i *ngIf="item.items" class="pi pi-angle-down text-primary ml-auto"></i>
                        </span>
                    </ng-template>
                </ng-template>
            </ng-template>
        </p-panelmenu>
    </div>
</aside>
