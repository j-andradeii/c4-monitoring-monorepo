<div class="grid grid-nogutter">
    <div class="col-12">
        <p-panelmenu [model]="sideBarItems" styleClass="church-campus-admin-sidebar-menu">
            <ng-template #item let-item>
                <ng-container *ngIf="item.id === SideBarItemType.ITEM">
                    <ng-container *ngIf="item.route; else urlRef">
                        <a  class="flex align-items-center
                            cursor-pointer text-color px-3 py-2">
                            <span [class]="item.icon"></span>
                            <span class="ml-2">{{ item.label }}</span>
                        </a>
                    </ng-container>
                    <ng-template #urlRef>
                        <a *ngIf="item.url; else noLink" [href]="item.url" class="flex align-items-center
                            cursor-pointer text-color px-3 py-2">
                            <span [class]="item.icon"></span>
                            <span class="ml-2">{{ item.label }}</span>
                        </a>
                        <ng-template #noLink>
                            <span class="flex items-center cursor-pointer text-surface-700 dark:text-surface-0 px-4 py-2">
                                <span [class]="item.icon"></span>
                                <span class="ml-2">{{ item.label }}</span>
                                <i *ngIf="item.items" class="pi pi-angle-down primary ml-auto"></i>
                            </span>
                        </ng-template>
                    </ng-template>
                </ng-container>
                <ng-container *ngIf="item.id === SideBarItemType.HEADER">
                    <p>{{item.label}}</p>
                </ng-container>
            </ng-template>


            <ng-template #item let-item>
        
            </ng-template>
        </p-panelmenu>
    </div>
</div>
