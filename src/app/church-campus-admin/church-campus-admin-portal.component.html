<main #mainDiv class="overflow-x-hidden">
    <div class="main-container w-100 v-95">
        <div #headerDiv class="grid grid-nogutter flex justify-content-center">
            <div class="col-fixed" style="width: 100%">
                <app-header ></app-header>
            </div>
        </div>

        <div class="grid grid-nogutter" [ngClass]="adminActivateSidebarToggle ? 'layout-static': 'layout-static-inactive'">
            <div class="sidebar-div" >
                <div style="width: 100%">
                    <app-sidebar></app-sidebar>
                </div>
            </div>

            <app-overlay-sidebar></app-overlay-sidebar> 

            <div  class="router-div ">
                <div style="width: 100%">
                    <app-nav-breadcrumbs></app-nav-breadcrumbs>
                </div>
                <div style="width: 100%">
                    <router-outlet></router-outlet>
                </div>
                <div style="width: 100%">
                    <app-footer></app-footer>
                </div>
            </div>
        </div>
     
    </div>
   
</main>
